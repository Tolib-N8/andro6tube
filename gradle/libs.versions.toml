[versions]
agp = "9.5.1"
newpipeExtractor = "v0.27.0"
media3 = "1.11.1"
okhttp = "4.12.0"
conscrypt = "2.5.3"
coil = "2.7.0"
coroutines = "1.11.0"
desugar = "2.1.5"
recyclerview = "1.4.0"
activity = "1.13.0"
core = "1.19.1"

[libraries]
newpipe-extractor = { module = "com.github.TeamNewPipe:NewPipeExtractor", version.ref = "newpipeExtractor" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
media3-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
conscrypt = { module = "org.conscrypt:conscrypt-android", version.ref = "conscrypt" }
coil = { module = "io.coil-kt:coil", version.ref = "coil" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-guava = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-guava", version.ref = "coroutines" }
desugar = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugar" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
activity = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
core = { module = "androidx.core:core-ktx", version.ref = "core" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
